<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tyre Carousel v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f2ed; font-family: sans-serif; }

  .tyre-carousel-section {
    background: #f5f2ed;
    padding: 80px 0 120px;
    overflow: visible;
  }

  /* Container is deliberately narrow (not full-bleed) so only ~3 items are
     visible at once, matching the reference: side tyres are cropped near
     the container edge, center tyre dominates. */
  .tyre-track-wrap {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    height: 380px;
    overflow-x: auto;
    overflow-y: visible;
    cursor: grab;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .tyre-track-wrap::-webkit-scrollbar { display: none; }
  .tyre-track-wrap.dragging { cursor: grabbing; }
  /* while we silently reposition scrollLeft for the infinite-loop wrap,
     scroll-behavior must be off or the browser will animate the jump */
  .tyre-track-wrap.no-smooth { scroll-behavior: auto; }

  .tyre-track {
    display: flex;
    align-items: center;
    height: 100%;
    width: max-content;
  }

  .tyre-item {
    flex: 0 0 200px;
    width: 200px;
    height: 200px;
    margin: 0 -10px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transform-origin: center center;
    will-change: transform;
    transition: transform 0.05s linear;
    pointer-events: none;
    user-select: none;
  }

  .tyre-item img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    -webkit-user-drag: none;
    user-select: none;
    filter: drop-shadow(0 18px 26px rgba(0,0,0,0.16));
  }

  /* the gray bar under the center tyre — always rendered per item, opacity
     driven by distance-from-center so only the true center one is visible */
  .tyre-bar {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 64px;
    height: 4px;
    border-radius: 2px;
    background: #9c968c;
    opacity: 0;
    transition: opacity 0.15s linear;
  }

  .tyre-track.settling .tyre-item {
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }
</style>
</head>
<body>

<section class="tyre-carousel-section">
  <div class="tyre-track-wrap" id="tyreWrap">
    <div class="tyre-track" id="tyreTrack"></div>
  </div>
</section>

<script>
(function () {
  // Base sequence — only 4 real images exist, so the infinite loop repeats
  // this sequence. Add more entries here later; nothing else needs to change.
  const BASE_TYRES = [
    { src: 'tyre1.jpeg', alt: 'Tyre 1' },
    { src: 'tyre2.jpeg', alt: 'Tyre 2' },
    { src: 'tyre3.jpeg', alt: 'Tyre 3' },
    { src: 'tyre4.jpeg', alt: 'Tyre 4' },
  ];

  // How many times to repeat the base sequence for the infinite-scroll illusion.
  // Must be enough that at any scroll position, at least one full sequence's
  // worth of buffer exists on both sides before a silent jump is needed.
  const REPEATS = 6;
  const N = BASE_TYRES.length;

  const wrap = document.getElementById('tyreWrap');
  const track = document.getElementById('tyreTrack');
  if (!wrap || !track) return;

  const allItems = [];
  for (let r = 0; r < REPEATS; r++) {
    BASE_TYRES.forEach((t) => {
      const el = document.createElement('div');
      el.className = 'tyre-item';
      const img = document.createElement('img');
      img.src = t.src;
      img.alt = t.alt;
      img.draggable = false;
      el.appendChild(img);
      const bar = document.createElement('div');
      bar.className = 'tyre-bar';
      el.appendChild(bar);
      track.appendChild(el);
      allItems.push(el);
    });
  }

  const ITEM_OUTER_WIDTH = 200 - 20; // 200 width + (-10*2) margin collapse
  const SEQUENCE_WIDTH = ITEM_OUTER_WIDTH * N;

  const SCALE_CENTER = 1.55;
  const SCALE_NEAR = 0.82;
  const SCALE_FAR = 0.6;
  const LIFT_CENTER = -24;
  const FALLOFF = 210; // tuned to the narrower 200px items / 760px viewport

  let ticking = false;
  let isDown = false;
  let startX = 0;
  let startScroll = 0;
  let velocityX = 0;
  let lastX = 0;
  let lastT = 0;
  let snapTimeout = null;
  let scrollEndTimer = null;

  function updateScales() {
    const wrapRect = wrap.getBoundingClientRect();
    const centerX = wrapRect.left + wrapRect.width / 2;
    let nearestEl = null;
    let nearestDist = Infinity;

    allItems.forEach((el) => {
      const r = el.getBoundingClientRect();
      const itemCenter = r.left + r.width / 2;
      const dist = Math.abs(itemCenter - centerX);
      const t = Math.min(dist / FALLOFF, 1);

      let scale, lift;
      if (t <= 0.5) {
        const localT = t / 0.5;
        scale = SCALE_CENTER + (SCALE_NEAR - SCALE_CENTER) * localT;
      } else {
        const localT = (t - 0.5) / 0.5;
        scale = SCALE_NEAR + (SCALE_FAR - SCALE_NEAR) * localT;
      }
      lift = LIFT_CENTER * (1 - t);

      el.style.transform = `translateY(${lift}px) scale(${scale})`;
      el.style.zIndex = String(Math.round((1 - t) * 100));

      const bar = el.querySelector('.tyre-bar');
      // bar only visible very near dead-center, fades fast so only one shows at a time
      bar.style.opacity = String(Math.max(0, 1 - dist / 40));

      if (dist < nearestDist) {
        nearestDist = dist;
        nearestEl = el;
      }
    });

    ticking = false;
    return nearestEl;
  }

  function requestScaleUpdate() {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(updateScales);
    }
  }

  // ---- Infinite loop: silently re-center scrollLeft into the middle
  // repeat block whenever it drifts into the first or last block ----
  function maintainLoop() {
    const min = SEQUENCE_WIDTH * 1;       // guard band: don't let it reach block 0
    const max = SEQUENCE_WIDTH * (REPEATS - 2); // guard band: don't let it reach last block
    if (wrap.scrollLeft < min) {
      wrap.classList.add('no-smooth');
      wrap.scrollLeft += SEQUENCE_WIDTH * (REPEATS - 3);
      // force reflow so the jump is applied before re-enabling smooth scroll
      void wrap.offsetHeight;
      wrap.classList.remove('no-smooth');
    } else if (wrap.scrollLeft > max) {
      wrap.classList.add('no-smooth');
      wrap.scrollLeft -= SEQUENCE_WIDTH * (REPEATS - 3);
      void wrap.offsetHeight;
      wrap.classList.remove('no-smooth');
    }
  }

  function snapToNearest() {
    const wrapRect = wrap.getBoundingClientRect();
    const centerX = wrapRect.left + wrapRect.width / 2;
    let nearest = allItems[0];
    let minDist = Infinity;
    allItems.forEach((el) => {
      const r = el.getBoundingClientRect();
      const itemCenter = r.left + r.width / 2;
      const dist = Math.abs(itemCenter - centerX);
      if (dist < minDist) {
        minDist = dist;
        nearest = el;
      }
    });
    const itemRect = nearest.getBoundingClientRect();
    const offset = (itemRect.left + itemRect.width / 2) - centerX;

    track.classList.add('settling');
    wrap.scrollBy({ left: offset, behavior: 'smooth' });

    window.clearTimeout(snapTimeout);
    snapTimeout = window.setTimeout(() => {
      track.classList.remove('settling');
      maintainLoop();
    }, 600);
  }

  function onScroll() {
    requestScaleUpdate();
    maintainLoop();
    window.clearTimeout(scrollEndTimer);
    scrollEndTimer = window.setTimeout(() => {
      if (!isDown) snapToNearest();
    }, 120);
  }

  wrap.addEventListener('scroll', onScroll, { passive: true });

  wrap.addEventListener('mousedown', (e) => {
    isDown = true;
    wrap.classList.add('dragging');
    track.classList.remove('settling');
    startX = e.pageX;
    startScroll = wrap.scrollLeft;
    lastX = e.pageX;
    lastT = performance.now();
    velocityX = 0;
    window.clearTimeout(scrollEndTimer);
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const dx = e.pageX - startX;
    wrap.scrollLeft = startScroll - dx;
    const now = performance.now();
    const dt = now - lastT || 16;
    velocityX = (e.pageX - lastX) / dt;
    lastX = e.pageX;
    lastT = now;
    requestScaleUpdate();
  });

  window.addEventListener('mouseup', () => {
    if (!isDown) return;
    isDown = false;
    wrap.classList.remove('dragging');
    const coast = -velocityX * 110;
    wrap.scrollBy({ left: coast, behavior: 'smooth' });
    window.setTimeout(snapToNearest, 170);
  });

  wrap.addEventListener('touchstart', (e) => {
    isDown = true;
    track.classList.remove('settling');
    startX = e.touches[0].pageX;
    startScroll = wrap.scrollLeft;
    window.clearTimeout(scrollEndTimer);
  }, { passive: true });

  wrap.addEventListener('touchmove', (e) => {
    if (!isDown) return;
    const dx = e.touches[0].pageX - startX;
    wrap.scrollLeft = startScroll - dx;
    requestScaleUpdate();
  }, { passive: true });

  wrap.addEventListener('touchend', () => {
    isDown = false;
    window.setTimeout(snapToNearest, 100);
  });

  wrap.addEventListener('wheel', (e) => {
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    wrap.scrollLeft += delta;
    e.preventDefault();
  }, { passive: false });

  function init() {
    requestAnimationFrame(() => {
      // start in the middle repeat block, centered on its first item
      const startIndex = Math.floor(REPEATS / 2) * N;
      const startEl = allItems[startIndex];
      const wrapRect = wrap.getBoundingClientRect();
      const itemRect = startEl.getBoundingClientRect();
      const offset = (itemRect.left + itemRect.width / 2) - (wrapRect.left + wrapRect.width / 2);
      wrap.scrollLeft += offset;
      updateScales();
    });
  }

  window.addEventListener('resize', () => {
    updateScales();
  });

  init();
})();
</script>

</body>
</html>
